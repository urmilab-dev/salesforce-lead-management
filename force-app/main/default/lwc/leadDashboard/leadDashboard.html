<template>
    <lightning-card title="Lead Management Dashboard" icon-name="standard:lead">

        <template if:true={isLoading}>
            <div class="slds-align_absolute-center slds-p-around_large">
                <lightning-spinner alternative-text="Loading leads..." size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>

            <div class="slds-grid slds-gutters slds-p-around_medium">

                <div class="slds-col slds-size_1-of-3">
                    <div class="lead-tile lead-tile--hot">
                        <p>HOT LEADS</p>
                        <p>{hotLeadCount}</p>
                        <p>Immediate Follow Up</p>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <div class="lead-tile lead-tile--warm">
                        <p>WARM LEADS</p>
                        <p>{warmLeadCount}</p>
                        <p>Follow Up Within 48hrs</p>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-3">
                    <div class="lead-tile lead-tile--cold">
                        <p>COLD LEADS</p>
                        <p>{coldLeadCount}</p>
                        <p>Nurture Campaign</p>
                    </div>
                </div>

            </div>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <h2 class="slds-text-heading_small slds-m-bottom_small">
                    Hot Leads — Requires Immediate Attention
                </h2>

                <template if:true={hasHotLeads}>
                    <lightning-datatable
                        key-field="id"
                        data={hotLeads}
                        columns={columns}
                        hide-checkbox-column
                        sorted-by={sortedBy}
                        sorted-direction={sortedDirection}
                        onsort={handleSort}>
                    </lightning-datatable>
                </template>

                <template if:false={hasHotLeads}>
                    <div class="slds-align_absolute-center slds-p-around_medium">
                        <p>No hot leads at this time.</p>
                    </div>
                </template>
            </div>

        </template>

    </lightning-card>
</template>
